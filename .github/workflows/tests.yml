# GitHub Actions workflow to lint, build and test.
name: "Tests"
on:
  push:

env:
  GO_VERSION: "1.24.x"
  GOLICENSER_VERSION: "0.3"

permissions:
  contents: read
  
jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Setup Go ${{ env.GO_VERSION }}"
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          check-latest: true

      # tests are not currently reliable; we need to add testing packages
      # back in, one by one
      - name: "test core"
        run: go test -v ./core

      - name: "test cmd/geth"
        run: go test -v ./cmd/geth

      - name: "test ./tests"
        run: go test -v ./tests

      - name: "test ./internal/..."
        run: go test -v ./internal/...

      - name: "test ./cmd/..."
        run: go test -v ./cmd/...
